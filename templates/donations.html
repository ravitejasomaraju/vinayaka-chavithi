<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collect Donation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #ff6f00;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            width: 94%;
            max-width: 700px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        h2 {
            color: #e65100;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #ff6f00;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e65100;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .info {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .container {
                width: 96%;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>💰 Collect Donation</h1>
</div>

<div class="container">

    <div class="card">

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <div class="info">
            Logged in as:
            <strong>{{ session.get("name") }}</strong>
        </div>

        <!-- IMPORTANT: POST goes to the donations endpoint -->
        <form method="POST" action="{{ url_for('donations') }}">

            <label for="donor_name">
                Donor Name
            </label>

            <input
                type="text"
                id="donor_name"
                name="donor_name"
                placeholder="Enter donor name"
                required
            >


            <label for="phone">
                Donor Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter donor phone number"
                maxlength="15"
            >


            <label for="amount">
                Donation Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter amount"
                min="0.01"
                step="0.01"
                required
            >


            <label for="payment_method">
                Payment Method
            </label>

            <select
                id="payment_method"
                name="payment_method"
                required
            >
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Other">Other</option>
            </select>


            <label for="payment_status">
                Payment Status
            </label>

            <select
                id="payment_status"
                name="payment_status"
                required
            >
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
                <option value="Cancelled">Cancelled</option>
            </select>


            <button type="submit">
                💰 Save Donation
            </button>

        </form>

        <a
            href="{{ url_for('member') }}"
            class="back">
            ← Back to Member Dashboard
        </a>

    </div>

</div>

</body>
</html>
