<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Donation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #ff6f00;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button,
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button {
            background: #ff6f00;
            color: white;
        }

        a {
            background: #777;
            color: white;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>✏️ Edit Donation</h1>
</div>

<div class="container">

    <div class="card">

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <label>Donor Name</label>
            <input
                type="text"
                name="donor_name"
                value="{{ donation[1] }}"
                required>

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                value="{{ donation[2] }}">

            <label>Amount</label>
            <input
                type="number"
                name="amount"
                value="{{ donation[3] }}"
                min="0"
                step="0.01"
                required>

            <label>Payment Method</label>
            <select name="payment_method">
                <option value="Cash" {% if donation[4] == "Cash" %}selected{% endif %}>Cash</option>
                <option value="UPI" {% if donation[4] == "UPI" %}selected{% endif %}>UPI</option>
                <option value="Bank Transfer" {% if donation[4] == "Bank Transfer" %}selected{% endif %}>Bank Transfer</option>
                <option value="Other" {% if donation[4] == "Other" %}selected{% endif %}>Other</option>
            </select>

            <label>Payment Status</label>
            <select name="payment_status">
                <option value="Paid" {% if donation[5] == "Paid" %}selected{% endif %}>Paid</option>
                <option value="Pending" {% if donation[5] == "Pending" %}selected{% endif %}>Pending</option>
                <option value="Cancelled" {% if donation[5] == "Cancelled" %}selected{% endif %}>Cancelled</option>
            </select>

            <button type="submit">Save Changes</button>

            <a href="{{ url_for('admin_donations') }}">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
