<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login</title><style>body{font-family:Arial;background:#fff3e0;padding:40px}.box{max-width:450px;margin:auto;background:white;padding:30px;border-radius:15px;box-shadow:0 4px 20px #bbb}input{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box}button,a{display:block;width:100%;padding:12px;margin-top:10px;box-sizing:border-box;border:0;border-radius:7px;text-align:center;text-decoration:none;font-weight:bold}button{background:#e65100;color:white}a{background:#777;color:white}.msg{color:#c62828}</style></head><body><div class="box"><h1>👤 Member Login</h1>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="msg">{{m}}</p>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Member phone or name" required><input type="password" name="password" placeholder="Password" required><button>Login</button></form><a href="{{url_for('login')}}">← Back</a></div></body></html>
