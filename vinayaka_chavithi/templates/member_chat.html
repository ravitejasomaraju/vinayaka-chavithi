
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Member Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #fff3e0,
                #ffe0b2
            );
        }

        .header {
            background: linear-gradient(
                135deg,
                #e65100,
                #ff9800
            );

            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-bottom: 0;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 25px auto;
        }

        .chat-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 15px;
            max-width: 75%;
        }

        .message-name {
            font-size: 13px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 4px;
        }

        .message-text {
            display: inline-block;
            padding: 11px 15px;
            border-radius: 15px;
            background: #eeeeee;
            color: #222;
            word-wrap: break-word;
        }

        .message-time {
            display: block;
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .send-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        .send-area input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .send-area input:focus {
            border-color: #e65100;
        }

        .send-btn {
            border: none;
            background: linear-gradient(
                135deg,
                #e65100,
                #ff9800
            );
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: scale(1.03);
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto;
            padding: 12px 25px;
            background: #555;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .back-btn:hover {
            background: #333;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 80px 20px;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 25px;
            }

            .messages {
                height: 450px;
            }

            .message {
                max-width: 90%;
            }

            .send-area {
                padding: 10px;
            }

            .send-btn {
                padding: 10px 16px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>💬 Member Chat</h1>

    <p>
        Chat with other Vinayaka Chavithi members
    </p>

</div>


<div class="container">


    <div class="chat-box">


        <!-- MESSAGES -->

        <div
            class="messages"
            id="messages"
        >

            {% if messages %}

                {% for message in messages %}

                <div class="message">

                    <div class="message-name">
                        👤 {{ message[2] }}
                    </div>

                    <div class="message-text">
                        {{ message[3] }}
                    </div>

                    <span class="message-time">

                        {{ message[4].strftime("%d-%m-%Y %I:%M %p") }}

                    </span>

                </div>

                {% endfor %}

            {% else %}

                <div class="empty">

                    <h3>
                        💬 No messages yet
                    </h3>

                    <p>
                        Start the conversation!
                    </p>

                </div>

            {% endif %}

        </div>


        <!-- SEND MESSAGE -->

        <form
            method="POST"
            action="{{ url_for('member_chat') }}"
            class="send-area"
        >

            <input
                type="text"
                name="message"
                placeholder="Type your message..."
                autocomplete="off"
                maxlength="1000"
                required
            >

            <button
                type="submit"
                class="send-btn"
            >
                Send ➤
            </button>

        </form>


    </div>


    <!-- BACK -->

    <a
        href="{{ url_for('member') }}"
        class="back-btn"
    >
        ← Back to Member Dashboard
    </a>


</div>


<script>

   <script>

let firstLoad = true;

async function loadMessages() {

    try {

        const response =
            await fetch(
                "{{ url_for('member_chat_messages') }}"
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        if (!data.messages) {
            return;
        }

        const container =
            document.getElementById("messages");

        if (!container) {
            return;
        }

        const oldScrollHeight =
            container.scrollHeight;

        const oldScrollTop =
            container.scrollTop;

        container.innerHTML = "";

        if (data.messages.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h3>💬 No messages yet</h3>
                    <p>Start the conversation!</p>
                </div>
            `;

        } else {

            data.messages.forEach(function(msg) {

                const messageDiv =
                    document.createElement("div");

                messageDiv.className = "message";

                messageDiv.innerHTML = `
                    <div class="message-name">
                        👤 ${escapeHtml(msg.sender_name)}
                    </div>

                    <div class="message-text">
                        ${escapeHtml(msg.message)}
                    </div>

                    <span class="message-time">
                        ${escapeHtml(msg.created_at)}
                    </span>
                `;

                container.appendChild(messageDiv);

            });

        }

        /*
         * Scroll to bottom on first load.
         */
        if (firstLoad) {

            container.scrollTop =
                container.scrollHeight;

            firstLoad = false;

        } else {

            /*
             * Keep the user at the bottom if
             * they were already there.
             */
            const nearBottom =
                oldScrollHeight -
                oldScrollTop -
                container.clientHeight < 100;

            if (nearBottom) {

                container.scrollTop =
                    container.scrollHeight;

            }

        }

    } catch (error) {

        console.log(
            "Chat refresh error:",
            error
        );

    }

}


/*
 * Prevent HTML from being inserted through
 * chat messages.
 */
function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/*
 * Load immediately.
 */
loadMessages();


/*
 * Refresh every 2 seconds.
 */
setInterval(
    loadMessages,
    2000
);

</script>

</script>


</body>

</html>
